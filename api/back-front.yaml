openapi: 3.0.0
info:
  title: Wiki Editor Backend API
  version: 1.0.0

servers:
  - url: /api/v1

paths:
  /tables/{dstId}/data:
    get:
      summary: Получить данные таблицы
      tags:
        - tables
      parameters:
        - name: dstId
          in: path
          required: true
          schema:
            type: string
        - name: viewId
          in: query
          required: false
          schema:
            type: string
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: pageNum
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableDataResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    TableDataResponse:
      type: object
      required:
        - tableId
        - fields
        - records
        - pagination
      properties:
        tableId:
          type: string
        tableName:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/TableField'
        records:
          type: array
          items:
            $ref: '#/components/schemas/TableRecord'
        pagination:
          $ref: '#/components/schemas/Pagination'

    TableField:
      type: object
      required:
        - id
        - name
        - type
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - SingleText
            - Text
            - SingleSelect
            - MultiSelect
            - Number
            - Currency
            - Percent
            - DateTime
            - Attachment
            - Member
            - Checkbox
            - Rating
            - URL
            - Phone
            - Email
        description:
          type: string
        property:
          type: object
          oneOf:
            - $ref: '#/components/schemas/SelectProperty'
            - $ref: '#/components/schemas/DateTimeProperty'
            - $ref: '#/components/schemas/NumberProperty'
            - $ref: '#/components/schemas/CurrencyProperty'

    SelectProperty:
      type: object
      properties:
        options:
          type: array
          items:
            $ref: '#/components/schemas/SelectOption'

    SelectOption:
      type: object
      required:
        - id
        - name
        - color
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string

    DateTimeProperty:
      type: object
      properties:
        dateFormat:
          type: string
          enum: ['YYYY-MM-DD', 'DD/MM/YYYY', 'YYYY/MM/DD']
          default: 'YYYY-MM-DD'
        includeTime:
          type: boolean
          default: false

    NumberProperty:
      type: object
      properties:
        precision:
          type: integer
          minimum: 0
          maximum: 10
          default: 0

    CurrencyProperty:
      type: object
      properties:
        precision:
          type: integer
          minimum: 0
          maximum: 10
          default: 2
        symbol:
          type: string

    TableRecord:
      type: object
      required:
        - recordId
        - fields
      properties:
        recordId:
          type: string
        fields:
          type: object
          additionalProperties: true
        createdAt:
          type: integer
          format: int64
        updatedAt:
          type: integer
          format: int64

    Pagination:
      type: object
      required:
        - pageNum
        - pageSize
        - total
        - hasMore
      properties:
        pageNum:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        hasMore:
          type: boolean

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
        message:
          type: string
        details:
          type: string