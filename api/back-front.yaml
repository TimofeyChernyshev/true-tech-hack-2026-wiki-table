openapi: 3.0.0
info:
  title: Wiki Editor Backend API
  version: 1.0.0

servers:
  - url: /api/v1

paths:
  /tables/{dstId}/records:
    get:
      summary: Получить записи таблицы
      tags:
        - tables
      parameters:
        - name: dstId
          in: path
          required: true
          schema:
            type: string
        - name: viewId
          in: query
          required: false
          schema:
            type: string
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: pageNum
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableDataResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Создать записи в таблице
      tags:
        - tables
      parameters:
        - name: dstId
          in: path
          required: true
          schema:
            type: string
        - name: viewId
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecordsRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      summary: Обновить записи в таблице
      tags:
        - tables
      parameters:
        - name: dstId
          in: path
          required: true
          schema:
            type: string
        - name: viewId
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRecordsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Удалить записи из таблицы
      tags:
        - tables
      parameters:
        - name: dstId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRecordsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteRecordsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    
    CreateRecordsRequest:
      type: object
      required:
        - records
      properties:
        records:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - fields
            properties:
              fields:
                type: object
                additionalProperties: true
                description: Ключи - имена полей, значения - данные для записи

    UpdateRecordsRequest:
      type: object
      required:
        - records
      properties:
        records:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - recordId
              - fields
            properties:
              recordId:
                type: string
              fields:
                type: object
                additionalProperties: true

    DeleteRecordsRequest:
      type: object
      required:
        - recordIds
      properties:
        recordIds:
          type: array
          minItems: 1
          items:
            type: string

    TableDataResponse:
      type: object
      required:
        - tableId
        - fields
        - records
        - pagination
      properties:
        tableId:
          type: string
        tableName:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/TableField'
        records:
          type: array
          items:
            $ref: '#/components/schemas/TableRecord'
        pagination:
          $ref: '#/components/schemas/Pagination'

    RecordsResponse:
      type: object
      required:
        - records
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/TableRecord'

    DeleteRecordsResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string

    TableField:
      type: object
      required:
        - id
        - name
        - type
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - SingleText
            - Text
            - SingleSelect
            - MultiSelect
            - Number
            - Currency
            - Percent
            - DateTime
            - Attachment
            - Member
            - Checkbox
            - Rating
            - URL
            - Phone
            - Email
        description:
          type: string
        property:
          type: object

    TableRecord:
      type: object
      required:
        - recordId
        - fields
      properties:
        recordId:
          type: string
        fields:
          type: object
          additionalProperties: true
        createdAt:
          type: integer
          format: int64
        updatedAt:
          type: integer
          format: int64

    Pagination:
      type: object
      required:
        - pageNum
        - pageSize
        - total
        - hasMore
      properties:
        pageNum:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        hasMore:
          type: boolean

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
        message:
          type: string
        details:
          type: string