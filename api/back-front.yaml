openapi: 3.0.0
info:
  title: Wiki Editor Backend API
  description: API для внутреннего взаимодействия фронтенда вики-редактора с бэкендом.
  version: 1.0.0

servers:
  - url: /api/v1
    description: API вики-редактора

paths:
  /tables/{dstId}/records:
    get:
      summary: Получить записи таблицы для отображения в редакторе
      description: Возвращает постраничный список записей из указанной таблицы.
      tags:
        - wiki-tables
      parameters:
        - name: dstId
          in: path
          description: Идентификатор таблицы (datasheet) в MWS Tables
          required: true
          schema:
            type: string
            example: 'dstFiaiw12AA'
        - name: viewId
          in: query
          description: ID представления для фильтрации и сортировки записей
          required: false
          schema:
            type: string
            example: 'viwG9l1VPD6nH'
        - name: pageSize
          in: query
          description: Количество записей на странице
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 150
            default: 100
            example: 100
        - name: maxRecords
          in: query
          description: Максимальное общее количество записей для возврата (альтернатива pageSize)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            example: 200
        - name: pageNum
          in: query
          description: Номер страницы (начинается с 1)
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
      responses:
        '200':
          description: Успешный ответ с данными таблицы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableRecordsResponse'
        '400':
          description: Невалидные параметры запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Таблица или представление не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    TableRecordsResponse:
      type: object
      required:
        - pageNum
        - pageSize
        - records
      properties:
        pageNum:
          type: integer
          description: Текущий номер страницы
          minimum: 1
          example: 1
        pageSize:
          type: integer
          description: Фактический размер страницы
          example: 50
        records:
          type: array
          description: Массив записей таблицы
          items:
            $ref: '#/components/schemas/TableRecord'

    TableRecord:
      type: object
      required:
        - recordId
        - fields
      properties:
        recordId:
          type: string
          description: Уникальный идентификатор записи
          example: 'recwZ6yV3Srv3'
        fields:
          type: object
          description: >
            Объект, содержащий значения полей записи.
            Ключи - это ID полей (fldXXX) или их имена (Title, Status).
            Значения зависят от типа поля (строка, число, массив для вложений и т.д.)
          additionalProperties: true
          example:
            Title: 'План разработки'
            Status: 'В работе'
            Assignee: 'Иван Петров'
            DueDate: '2025-12-31'
        createdAt:
          type: integer
          format: int64
          description: Unix timestamp (в миллисекундах) создания записи
          example: 1735689600000
        updatedAt:
          type: integer
          format: int64
          description: Unix timestamp (в миллисекундах) последнего обновления записи
          example: 1738368000000

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: Код ошибки
          example: 404
        message:
          type: string
          description: Cообщение об ошибке
          example: 'Table with ID dstFiaiw12AA not found'
        details:
          type: string
          description: Дополнительные технические детали
          example: 'The specified datasheet does not exist in space spc123'