openapi: 3.0.0
info:
  title: GPT Service API
  description: |
    Сервис для взаимодействия с AI-моделями.
    Проксирует запросы к MWS GPT, добавляя авторизацию и обработку ошибок.
  version: 1.0.0

servers:
  - url: /api/v1
    description: GPT Service

paths:
  /gpt/models:
    get:
      summary: Получить список доступных моделей
      description: Возвращает список моделей, доступных пользователю
      tags:
        - models
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Список моделей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /gpt/chat:
    post:
      summary: Отправить сообщение в чат
      description: |
        Диалоговое взаимодействие с AI-моделью.
        Поддерживает историю сообщений и системные промпты.
      tags:
        - chat
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Ответ модели
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /gpt/chat/stream:
    post:
      summary: Отправить сообщение в чат (streaming)
      description: |
        Диалоговое взаимодействие с AI-моделью с потоковой передачей ответа.
        Ответ приходит по частям (токенам) как в ChatGPT.
      tags:
        - chat
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Поток ответов
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /gpt/generate:
    post:
      summary: Сгенерировать текст
      description: |
        Генерация текста на основе промпта.
        Используется для завершения текста, кодогенерации и т.д.
      tags:
        - generation
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '200':
          description: Сгенерированный текст
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /gpt/embeddings:
    post:
      summary: Получить эмбеддинги текста
      description: |
        Преобразование текста в векторное представление.
        Используется для семантического поиска и классификации.
      tags:
        - embeddings
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingsRequest'
      responses:
        '200':
          description: Векторное представление
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    
    ModelsResponse:
      type: object
      required:
        - models
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelInfo'

    ModelInfo:
      type: object
      required:
        - id
        - name
        - provider
      properties:
        id:
          type: string
          description: Идентификатор модели
          example: "mts-anya"
        name:
          type: string
          description: Отображаемое имя
          example: "MTS Anya"
        provider:
          type: string
          description: Провайдер модели
          example: "MWS"
        description:
          type: string
          description: Описание модели
          example: "Русскоязычная модель для диалогов"
        contextLength:
          type: integer
          description: Максимальная длина контекста в токенах
          example: 8192
        features:
          type: array
          items:
            type: string
            enum: ["chat", "completion", "embeddings", "streaming"]
          description: Поддерживаемые функции

    ChatRequest:
      type: object
      required:
        - messages
      properties:
        model:
          type: string
          description: ID модели (если не указан, используется по умолчанию)
          example: "mts-anya"
        messages:
          type: array
          description: История сообщений
          items:
            $ref: '#/components/schemas/Message'
        temperature:
          type: number
          format: float
          minimum: 0.0
          maximum: 2.0
          default: 0.7
          description: Креативность ответов (0 = точные, 1 = творческие)
        maxTokens:
          type: integer
          minimum: 1
          maximum: 4096
          default: 1000
          description: Максимальная длина ответа в токенах
        systemPrompt:
          type: string
          description: Системный промпт (альтернатива message с role=system)
          example: "Ты полезный ассистент"

    Message:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: ["system", "user", "assistant"]
          description: Роль отправителя
        content:
          type: string
          description: Текст сообщения

    ChatResponse:
      type: object
      required:
        - message
        - usage
      properties:
        id:
          type: string
          description: ID ответа
          example: "resp_123"
        message:
          $ref: '#/components/schemas/Message'
        usage:
          $ref: '#/components/schemas/TokenUsage'
        model:
          type: string
          description: Использованная модель
          example: "mts-anya"

    GenerateRequest:
      type: object
      required:
        - prompt
      properties:
        model:
          type: string
          description: ID модели
          example: "mts-anya"
        prompt:
          type: string
          description: Текст для продолжения
          example: "Искусственный интеллект — это"
        temperature:
          type: number
          format: float
          minimum: 0.0
          maximum: 2.0
          default: 0.7
        maxTokens:
          type: integer
          minimum: 1
          maximum: 4096
          default: 150
        stopSequences:
          type: array
          items:
            type: string
          description: Стоп-слова для остановки генерации
          example: ["\n", "###"]

    GenerateResponse:
      type: object
      required:
        - text
        - usage
      properties:
        id:
          type: string
          example: "gen_123"
        text:
          type: string
          description: Сгенерированный текст
          example: "Искусственный интеллект — это область компьютерных наук..."
        usage:
          $ref: '#/components/schemas/TokenUsage'
        model:
          type: string
          example: "mts-anya"

    EmbeddingsRequest:
      type: object
      required:
        - input
      properties:
        model:
          type: string
          description: ID модели для эмбеддингов
          default: "bge-m3"
          example: "bge-m3"
        input:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          description: Текст или массив текстов для векторизации
          example: "Привет, как дела?"

    EmbeddingsResponse:
      type: object
      required:
        - embeddings
        - usage
      properties:
        embeddings:
          type: array
          items:
            $ref: '#/components/schemas/EmbeddingData'
        model:
          type: string
          example: "bge-m3"
        usage:
          $ref: '#/components/schemas/TokenUsage'

    EmbeddingData:
      type: object
      required:
        - index
        - embedding
      properties:
        index:
          type: integer
          description: Индекс в исходном массиве
          example: 0
        embedding:
          type: array
          items:
            type: number
            format: float
          description: Вектор размерности 1024

    TokenUsage:
      type: object
      required:
        - promptTokens
        - completionTokens
        - totalTokens
      properties:
        promptTokens:
          type: integer
          description: Токенов в запросе
          example: 15
        completionTokens:
          type: integer
          description: Токенов в ответе
          example: 42
        totalTokens:
          type: integer
          description: Всего токенов
          example: 57

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum: ["BAD_REQUEST", "UNAUTHORIZED", "FORBIDDEN", "NOT_FOUND", "RATE_LIMITED", "INTERNAL_ERROR", "MODEL_ERROR"]
              example: "BAD_REQUEST"
            message:
              type: string
              description: Человекочитаемое сообщение
              example: "Invalid model specified"
            details:
              type: string
              description: Технические детали