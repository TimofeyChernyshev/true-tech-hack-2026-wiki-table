server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # WebSocket wiki-page (cmd/wiki_page) — до общего /api/, иначе запрос уйдёт на table и будет 404.
    # Внутри сети Docker page всегда слушает 8081 (WIKI_PAGE_PORT), см. docker-compose.
    location /api/v1/ws {
        proxy_pass http://page:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # MWS GPT (cmd/mws_gpt): порт внутри сети Docker должен совпадать с GPT_PORT в compose (по умолчанию 8083).
    location /api/v1/gpt/ {
        proxy_pass http://gpt:8083/api/v1/gpt/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Имя сервиса из docker-compose.yml — сервис `table`.
    # Порт должен совпадать с TABLE_PORT внутри контейнера (по умолчанию 8080).
    location /api/ {
        proxy_pass http://table:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://table:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
