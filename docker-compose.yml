services:
  postgres:
    image: postgres:16-alpine
    container_name: wiki-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-wiki}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./auth-service/migrations:/docker-entrypoint-initdb.d
    networks:
      - wiki-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth:
    build:
      context: ./backend
      dockerfile: Dockerfile.auth
    container_name: wiki-auth
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${AUTH_PORT:-8082}:${AUTH_PORT:-8082}"
    environment:
      - AUTH_PORT=${AUTH_PORT:-8082}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-wiki}
      - SSLMODE=${SSLMODE:-disable}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_TTL=${JWT_ACCESS_TTL:-15m}
      - JWT_REFRESH_TTL=${JWT_REFRESH_TTL:-168h}
      - HTTP_READ_TIMEOUT=${HTTP_READ_TIMEOUT:-15s}
      - ALLOW_ORIGINS=${ALLOW_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wiki-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${AUTH_PORT:-8082}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  table:
    build:
      context: ./backend
      dockerfile: Dockerfile.table
    container_name: wiki-table
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${TABLE_PORT:-8080}:${TABLE_PORT:-8080}"
    environment:
      - MWS_TABLES_BASE_URL=${MWS_TABLES_BASE_URL}
      - MWS_API_KEY=${MWS_API_KEY}
      - MWS_TABLES_REQUEST_TIMEOUT=${MWS_TABLES_REQUEST_TIMEOUT:-60s}
      - ALLOW_ORIGINS=${ALLOW_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000}
      - TABLE_PORT=${TABLE_PORT:-8080}
      - HTTP_READ_TIMEOUT=${HTTP_READ_TIMEOUT:-15s}
      - WIKI_DATA_DIR=${WIKI_DATA_DIR:-/app/data/wiki}
    volumes:
      - wiki-pages:/app/data/wiki
    networks:
      - wiki-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${TABLE_PORT:-8080}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  page:
    build:
      context: ./backend
      dockerfile: Dockerfile.wiki-page
    container_name: wiki-page
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PAGE_PORT:-8081}:${PAGE_PORT:-8081}"
    environment:
      - PAGE_PORT=${PAGE_PORT:-8081}
      - TABLE_SERVICE_BASE_URL=http://table:${TABLE_PORT}/api/v1
      - TABLE_SERVICE_REQUEST_TIMEOUT=30s
    volumes:
      - wiki-pages:/app/data/pages
    depends_on:
      postgres:
        condition: service_healthy
      table:
        condition: service_healthy
    networks:
      - wiki-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PAGE_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  gpt:
    build:
      context: ./backend
      dockerfile: Dockerfile.gpt
    container_name: wiki-gpt
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${GPT_PORT:-8083}:${GPT_PORT:-8083}"
    environment:
      - GPT_PORT=${GPT_PORT:-8083}
      - MWS_GPT_BASE_URL=${MWS_GPT_BASE_URL}
      - MWS_GPT_API_KEY=${MWS_GPT_API_KEY}
      - MWS_GPT_REQUEST_TIMEOUT=${MWS_GPT_REQUEST_TIMEOUT:-60s}
      - ALLOW_ORIGINS=${ALLOW_ORIGINS}
      - HTTP_READ_TIMEOUT=${HTTP_READ_TIMEOUT:-30s}
    networks:
      - wiki-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${GPT_PORT:-8083}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: wiki-web
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      table:
        condition: service_healthy
      page:
        condition: service_healthy
    networks:
      - wiki-network

volumes:
  postgres-data:
  wiki-pages:

networks:
  wiki-network:
    driver: bridge
    name: wiki-network