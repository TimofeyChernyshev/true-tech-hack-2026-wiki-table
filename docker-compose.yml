services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wiki-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8080}:${HTTP_PORT:-8080}"
    environment:
      - MWS_TABLES_BASE_URL=${MWS_TABLES_BASE_URL}
      - MWS_API_KEY=${MWS_API_KEY}
      - MWS_TABLES_REQUEST_TIMEOUT=${MWS_TABLES_REQUEST_TIMEOUT:-60s}
      - ALLOW_ORIGINS=${ALLOW_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000}
      - HTTP_PORT=${HTTP_PORT:-8080}
      - HTTP_READ_TIMEOUT=${BACKEND_READ_TIMEOUT:-15s}
      - WIKI_DATA_DIR=${WIKI_DATA_DIR:-/app/data/wiki}
    volumes:
      - wiki-pages:/app/data/wiki
    networks:
      - wiki-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${HTTP_PORT:-8080}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: wiki-web
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - wiki-network

volumes:
  wiki-pages:

networks:
  wiki-network:
    driver: bridge
    name: wiki-network